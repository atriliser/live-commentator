<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Live Commentator</title>
</head>
<body>
  <h1>Live Commentator</h1>
  <script>
    const source = new EventSource("/matches/8658/events");
    source.onmessage = (event) => {
      console.log("event:", event.data);
    };
    source.onerror = () => {
      console.log("stream error, browser will retry");
    };
  </script>
</body>
</html>
